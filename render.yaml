# Render Blueprint: one web service runs the FastAPI backend and serves the built frontend.
services:
  - type: web
    name: elderguard
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    # The free plan has no persistent disk, so the SQLite demo data is re-seeded on every start.
    startCommand: cd backend && python seed_connected_demo.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: JWT_SECRET
        generateValue: true
      # Telegram alerts: create the bot with @BotFather, then enter the values in the Render dashboard.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
